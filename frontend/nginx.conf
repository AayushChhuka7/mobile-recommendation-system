# nginx config for the React/Vite SPA.
#
# SPA fallback (try_files $uri /index.html) is required because the
# frontend uses react-router-dom for client-side routing. Without it,
# a hard reload on a route like /phone/abc returns 404.

server {
    # 8080 inside the container — non-root-friendly for platforms that
    # refuse UID 0 binding (the nginx:alpine image ships a non-root
    # nginx user that can bind 8080 without extra config).
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip JS / CSS / SVG. Vite already minifies, but gzipping
    # 200-500 KB bundles saves ~70% bandwidth.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Vite uses content-hashed filenames for assets (assets/index-AbCd.js).
    # They are safe to cache forever — a code change always produces a
    # new hash.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA shell itself (index.html) is NOT immutable — Vite emits
    # new HTML on every deploy that references the latest asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: anything that isn't a real file under root → index.html.
    # This is what makes react-router-dom routes resolve on hard reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache error pages.
    error_page 404 /index.html;
}
