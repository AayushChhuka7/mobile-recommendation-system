# ----------------------------------------------------------------------------
# Mobile Recommendation System — local dev stack
#
# Boot order:
#   postgres (healthy) -> db-init (one-shot: schema push, RBAC seed, phone
#                         bulk CSV, customer bulk CSV)
#                     -> ml-service (healthy) + cf-service (healthy) +
#                        backend (waits on db-init)
#                     -> frontend
# ----------------------------------------------------------------------------

services:
  # PostgreSQL Database
  # Credentials are read from the host environment (root .env file).
  # Copy .env.example to .env and set real values before first run.
  postgres:
    image: postgres:16-alpine
    container_name: mobile-recommender-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # POSTGRES_PASSWORD is REQUIRED. Quoted because the error message
      # contains a colon (`:?`) which would otherwise confuse the YAML parser.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-mobile_recommender}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Reuses the POSTGRES_USER / POSTGRES_DB env vars so healthcheck stays
      # in sync with whatever the dev configured in .env.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mobile_recommender}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot DB initializer:
  #   1. prisma db push                          -> apply schema
  #   2. npm run seed:rbac                       -> system roles + customer backfill
  #   3. node prisma/import-gsmarena-bulk.mjs    -> seed phones/brands/variants/specs
  #   4. npm run seed:customers                  -> seed users + customer activity
  #                                                (payment / browsing / search history)
  # Exits 0; the backend waits for this with service_completed_successfully.
  db-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mobile-recommender-db-init
    # Override CMD. We pass the CSV paths explicitly so the scripts don't
    # need to know where the files live relative to themselves.
    command: >
      sh -c "npx prisma db push &&
             npm run seed:rbac &&
             node ./prisma/import-gsmarena-bulk.mjs /seed/GSMArena_Cleaned_Dataset.csv &&
             npm run seed:customers -- /seed/customer_dataset.csv"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-mobile_recommender}"
      NODE_ENV: development
    volumes:
      # Bind-mount the CSVs into the container. Host paths are relative
      # to the compose file, i.e. <repo-root>/dataset/*.csv
      - ./dataset/GSMArena_Cleaned_Dataset.csv:/seed/GSMArena_Cleaned_Dataset.csv:ro
      - ./dataset/customer_dataset.csv:/seed/customer_dataset.csv:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Don't restart a one-shot job — if it fails, you want to see it.
    restart: "no"

  # ML FastAPI Service
  ml-service:
    build:
      context: ./ML Model
      dockerfile: Dockerfile
    container_name: mobile-recommender-ml
    restart: unless-stopped
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # CF (collaborative-filtering) FastAPI Service
  #
  # Loads `cf_recommender.pkl` (the trained SVD+item-cosine hybrid model)
  # from a bind-mounted volume on startup and serves recommendation
  # requests on port 9001. The pickle is bind-mounted (not COPY'd) so a
  # retrain only requires re-mounting the volume — no image rebuild.
  #
  # The backend's `recommendService` calls this service in parallel
  # with the existing `ml-service`. The CF call NEVER blocks the
  # response: a timeout / unreachable error is logged as a warning and
  # the served list degrades to the existing rule-based + content-based
  # candidates. The service is exposed only on the internal Docker
  # network (no host port) — admin/health probes should hit
  # `docker compose exec cf-service curl http://127.0.0.1:9001/health`.
  cf-service:
    build:
      context: ./ML Model/filtering
      dockerfile: Dockerfile
    container_name: mobile-recommender-cf
    restart: unless-stopped
    # No `ports:` — internal-only. The backend reaches it via
    # http://cf-service:9001 (CF_BASE_URL env var on the backend).
    environment:
      # MODEL_DIR tells the FastAPI service where to find
      # `cf_recommender.pkl`. We bind-mount the trained output dir
      # (read-only) and override the default (which expects the
      # artifact to live at /app/../03_collaborative_filtering/output
      # inside the image — that path doesn't exist when the pickle
      # is mounted from the host).
      CF_MODEL_DIR: /model/cf
    volumes:
      # Trained CF model artifact + its companion CSVs.
      - ./ML Model/filtering/03_collaborative_filtering/output:/model/cf:ro
      # KMeans segmentation output — read by the BE's
      # `cfRecommendationService.mjs` to lazily hydrate
      # `CustomerCluster` rows. Not needed by the CF FastAPI
      # itself, but mounted here so the service image doesn't
      # bake it in either. (The BE reads the SAME files from the
      # host filesystem directly when running outside Docker, and
      # via the same bind path inside Docker.)
      - ./ML Model/filtering/02_segmentation/output:/model/seg:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Pickle load can take 15-25s on a cold volume mount + first
      # import of numpy/pandas/sklearn/implicit.
      start_period: 45s

  # Node.js Backend
  # All runtime secrets (DB, session key, mail) are injected from the host
  # environment. Set them in the root .env file (see .env.example) or in a
  # shell environment before running `docker compose up`.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mobile-recommender-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # DATABASE_URL is quoted because the value contains a `:` after the
      # password error message which would otherwise confuse the YAML parser.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-mobile_recommender}"
      # COOKIE_SECRET is REQUIRED. Quoted because the error message contains
      # a colon (`:?`) which would otherwise confuse the YAML parser.
      # Generate one with: openssl rand -hex 32
      COOKIE_SECRET: "${COOKIE_SECRET:?COOKIE_SECRET must be set in .env — run: openssl rand -hex 32}"
      ML_BASE_URL: http://ml-service:8002
      # CF (collaborative-filtering) FastAPI service URL. The BE's
      # cfRecommendationService gracefully degrades when this URL is
      # unreachable — never fatal, just a warn log + no CF candidates
      # in the served list.
      CF_BASE_URL: http://cf-service:9001
      NODE_ENV: development
      PORT: 8001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Mail — optional in dev, required for OTP / password-reset flows.
      # Reads from the host env so the real credentials never enter git.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      ml-service:
        condition: service_healthy
      cf-service:
        condition: service_healthy

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mobile-recommender-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8001/api
    depends_on:
      - backend

volumes:
  postgres_data:
